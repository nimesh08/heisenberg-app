[project]
name = "heisenberg"
version = "0.1.0"
description = "Heisenberg v1 — quantum browser IDE platform"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Nimesh Cheedella", email = "chnimesh0808@gmail.com" }]
dependencies = [
  "heisenberg-jobsvc",
  "heisenberg-launcher",
]

[tool.uv.sources]
heisenberg-jobsvc = { workspace = true }
heisenberg-launcher = { workspace = true }

[tool.uv.workspace]
members = ["jobsvc", "launcher"]

# Compiler wheels (heisenberg-photon, heisenberg-spinor-submit) are NOT in the
# workspace dep set yet — they're not on PyPI. For local dev:
#   uv pip install -e /path/to/quantum-stack/photon/bindings/python
#   uv pip install -e /path/to/quantum-stack/spinor/submit/python
# When 0.5.x ships to PyPI, add them as a `compiler` extra in jobsvc/pyproject.toml.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "B",                # bugbear
  "UP",               # pyupgrade
  "ASYNC",            # async best-practices
  "S",                # bandit
  "C4",               # comprehensions
  "RET",              # return values
  "SIM",              # simplify
  "PL",               # pylint
  "TID",              # tidy imports
]
ignore = [
  "E501",             # line length (use ruff format)
  "PLR0913",          # too many args
  "S101",             # asserts ok in tests
  "S603",             # subprocess without shell=False is intentional in transpile/lsp
  "PLR2004",          # magic values are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PLR", "PLW", "ASYNC"]
"**/alembic/versions/*.py" = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["build/", "dist/", ".venv/"]

[[tool.mypy.overrides]]
module = ["spinor_submit.*", "photon.*", "stripe.*", "pgls.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["jobsvc/tests", "launcher/tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "integration: requires a running Postgres",
  "regression: frozen end-to-end behaviour",
]
