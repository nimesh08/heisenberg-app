# Alembic config for heisenberg-jobsvc.
#
# Migrations live in `src/jobsvc/migrations/versions/`. The script directory is
# kept inside the package so the wheel ships them and the `heisenberg setup-db`
# launcher subcommand can run `alembic upgrade head` against the installed
# package on production EC2.
#
# The DB URL is *not* hard-coded here — env.py reads HEISENBERG_DATABASE_URL
# (via jobsvc.config.get_settings()), so `alembic upgrade head` always uses the
# same URL the running app uses.

[alembic]
script_location = src/jobsvc/migrations
prepend_sys_path = src
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

# sqlalchemy.url is intentionally empty; env.py injects it from settings.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
