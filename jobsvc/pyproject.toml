[project]
name = "heisenberg-jobsvc"
version = "0.1.0"
description = "Heisenberg jobsvc — FastAPI backend for the quantum-computing platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Nimesh Cheedella", email = "chnimesh0808@gmail.com" }]
keywords = ["quantum", "fastapi", "saas", "heisenberg"]

dependencies = [
  # Web framework
  "fastapi==0.137.1",
  "uvicorn[standard]>=0.34,<0.35",

  # ORM + DB
  "sqlmodel>=0.0.22,<0.1",
  "sqlalchemy>=2.0,<2.1",
  "asyncpg>=0.30,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",

  # Pydantic
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",

  # Auth + crypto
  "pwdlib[argon2]>=0.2.1,<1.0",
  "authlib>=1.3,<2.0",
  "pyotp>=2.9,<3.0",
  "webauthn>=2.5,<3.0",

  # HTTP / external services
  "httpx>=0.27,<1.0",
  "stripe>=11,<13",

  # LSP
  "pygls>=2.0.0a1,<3.0",

  # Rate limiting + middleware
  "slowapi>=0.1.9,<1.0",

  # Logging + metrics
  "structlog>=24,<26",
  "prometheus-client>=0.20,<0.22",

  # YAML + utilities
  "pyyaml>=6.0,<7.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Compiler + cloud submitter extra is intentionally NOT declared here yet —
# heisenberg-photon and heisenberg-spinor-submit are not on PyPI as of this commit.
# Local dev: `uv pip install -e /path/to/quantum-stack/photon/bindings/python` and
# the corresponding spinor-submit path. Once 0.5.x is published, we'll add a
# `compiler = ["heisenberg-photon>=0.5,<0.6", "heisenberg-spinor-submit>=0.5,<0.6"]`
# extra and pin it in heisenberg-jobsvc's release Train.
test = [
  "pytest>=8.2,<10",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<7.0",
  "freezegun>=1.5,<2.0",
  "respx>=0.21,<1.0",
  "testcontainers[postgres]>=4.5,<5.0",
]

[project.scripts]
jobsvc = "jobsvc.main:run"
jobsvc-worker = "jobsvc.worker:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsvc"]
